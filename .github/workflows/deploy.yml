name: Deploy to EC2

# Auto-deploys the dashboard to the EC2 host on every push to main.
#
# Requires these GitHub repo secrets (Settings -> Secrets and variables -> Actions):
#   EC2_HOST        public DNS / IP of the instance   (e.g. ec2-1-2-3-4.compute.amazonaws.com)
#   EC2_USER        ssh user                          (e.g. ubuntu)
#   EC2_SSH_KEY     private key that matches a key in the instance's authorized_keys
#   EC2_PORT        ssh port (optional, defaults to 22)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.EC2_PORT || 22 }}" -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync site to server
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude '.github' --exclude 'deploy' \
            --exclude 'README.md' --exclude '*.md' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.EC2_PORT || 22 }}" \
            ./ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/codemonkey/"

      - name: Fix permissions & reload nginx
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.EC2_PORT || 22 }}" \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            'sudo chown -R www-data:www-data /var/www/codemonkey && sudo nginx -t && sudo systemctl reload nginx'
