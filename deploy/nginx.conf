# =============================================================================
#  Nginx site config for the Code Monkey dashboard (static site, HTTPS).
#  Installed to /etc/nginx/sites-available/codemonkey by setup-server.sh.
#  Replace DOMAIN_PLACEHOLDER with your domain (or the EC2 public DNS name).
# =============================================================================

# ---- HTTP: redirect everything to HTTPS (except the ACME challenge) ----
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_PLACEHOLDER;

    # Allow Let's Encrypt HTTP-01 validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: serve the dashboard ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name DOMAIN_PLACEHOLDER;

    root /var/www/codemonkey;
    index index.html;

    # TLS certificates (issued by certbot; paths updated automatically)
    ssl_certificate     /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/privkey.pem;

    # Modern, hardened TLS only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Content-Security-Policy: all scripts self-hosted; data only from Google's
    # published-CSV endpoint; fonts from Google Fonts. No inline scripts allowed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://docs.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Hide nginx version
    server_tokens off;

    # ---- Caching ----
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    # Always revalidate the data + entry point
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /assets/data/ { add_header Cache-Control "no-cache"; }

    # Gzip
    gzip on;
    gzip_types text/css application/javascript text/csv image/svg+xml;
    gzip_min_length 1024;

    # Block dotfiles (e.g. .git) just in case
    location ~ /\.(?!well-known) { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }
}
