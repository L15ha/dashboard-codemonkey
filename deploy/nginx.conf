# =============================================================================
#  Nginx site config for the Code Monkey dashboard (static site, HTTPS).
#  Installed to /etc/nginx/sites-available/codemonkey by setup-server.sh.
#  Replace DOMAIN_PLACEHOLDER with your domain (or the EC2 public DNS name).
# =============================================================================

# Pages (HTML) must always be revalidated so visitors get updates immediately
map $uri $cm_cache_control {
    ~\.html$ "no-cache";
    ~/$       "no-cache";
    default   "";
}

# ---- HTTP: redirect everything to HTTPS (except the ACME challenge) ----
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_PLACEHOLDER;

    # Allow Let's Encrypt HTTP-01 validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: serve the dashboard ----
server {
    # "listen ... http2" form: Ubuntu 24.04 ships nginx 1.24, which lacks "http2 on;"
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAIN_PLACEHOLDER;

    root /var/www/codemonkey;
    index index.html;

    # TLS certificates (issued by certbot; paths updated automatically)
    ssl_certificate     /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/privkey.pem;

    # Modern, hardened TLS only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control $cm_cache_control always;

    # Content-Security-Policy: all scripts self-hosted; data only from this
    # server; fonts from Google Fonts. No inline scripts allowed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Hide nginx version
    server_tokens off;

    # ---- Caching ----
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    # LMS progress snapshot, written outside the web root by codemonkey-progress.timer
    location = /progress/data/progress.json {
        alias /var/lib/codemonkey/progress.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Block dotfiles (e.g. .git) just in case
    location ~ /\.(?!well-known) { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }
}
